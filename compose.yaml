services:
  tasktracker-api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      APP_MODE: server
      APP_HOST: 0.0.0.0
      APP_PORT: 8765
    expose:
      - "8765"
    ports:
      - "127.0.0.1:8765:8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
